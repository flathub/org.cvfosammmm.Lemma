id: org.cvfosammmm.Lemma
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: lemma
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
modules:
  - python3-requirements.yaml
  - name: lemma
    buildsystem: meson
    config-opts:
      - --buildtype=release
    sources:
      - type: git
        url: https://github.com/cvfosammmm/Lemma.git
        commit: 9f0894095879a5068c3187bba1b847ee63cae007
